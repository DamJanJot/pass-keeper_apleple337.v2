<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Lista i podglad wpisu w Pass Keeper v2</title>
  <desc id="desc">Terminal pokazuje liste bez hasel oraz jawny podglad wybranego wpisu.</desc>
  <rect width="1200" height="720" rx="24" fill="#0b1220"/>
  <rect x="28" y="28" width="1144" height="56" rx="14" fill="#182235"/>
  <circle cx="62" cy="56" r="9" fill="#ff5f57"/>
  <circle cx="91" cy="56" r="9" fill="#febc2e"/>
  <circle cx="120" cy="56" r="9" fill="#28c840"/>
  <text x="600" y="63" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="18">Pass Keeper v2 — lista i szczegóły</text>

  <rect x="28" y="104" width="760" height="580" rx="14" fill="#070b12"/>
  <g fill="#d7e0ea" font-family="Consolas, 'Courier New', monospace" font-size="17">
    <text x="58" y="146" fill="#7dd3fc">Lp.  Nazwa                    Uzytkownik               Adres</text>
    <text x="58" y="178">----------------------------------------------------------------------------</text>
    <text x="58" y="214"><tspan fill="#fbbf24">  1.</tspan> GitHub                   demo@example.test         https://github.com</text>
    <text x="58" y="248"><tspan fill="#fbbf24">  2.</tspan> Poczta testowa           test@example.test         https://example.test</text>
    <text x="58" y="294">Podaj numer albo dokladna nazwe wpisu: <tspan fill="#fbbf24">1</tspan></text>
    <text x="58" y="346" fill="#7dd3fc">--- Szczegoly wpisu ---</text>
    <text x="58" y="384">Nazwa:        <tspan fill="#4ade80">GitHub</tspan></text>
    <text x="58" y="418">Uzytkownik:   <tspan fill="#4ade80">demo@example.test</tspan></text>
    <text x="58" y="452">Haslo:        <tspan fill="#f472b6">gR7!mP2#vL9@xQ4$kN8&amp;zT6?</tspan></text>
    <text x="58" y="486">URL:          <tspan fill="#4ade80">https://github.com</tspan></text>
    <text x="58" y="520">Notatka:      <tspan fill="#4ade80">konto demonstracyjne</tspan></text>
    <text x="58" y="554">Aktualizacja: 2026-10-26T16:00:00+00:00</text>
    <text x="58" y="618" fill="#94a3b8">Lista nie pokazuje hasel. Szczegoly sa wyswietlane na zadanie.</text>
  </g>

  <rect x="816" y="104" width="356" height="580" rx="14" fill="#111c2e"/>
  <text x="846" y="150" fill="#7dd3fc" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">Praca z sejfem</text>
  <g fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="19">
    <circle cx="850" cy="210" r="18" fill="#0891b2"/><text x="850" y="217" text-anchor="middle" fill="white" font-weight="700">1</text>
    <text x="884" y="204"><tspan x="884">Lista pokazuje metadane,</tspan><tspan x="884" dy="27">ale nie odsłania haseł.</tspan></text>
    <circle cx="850" cy="320" r="18" fill="#0891b2"/><text x="850" y="327" text-anchor="middle" fill="white" font-weight="700">2</text>
    <text x="884" y="314"><tspan x="884">Wpis można wybrać numerem</tspan><tspan x="884" dy="27">albo dokładną nazwą.</tspan></text>
    <circle cx="850" cy="430" r="18" fill="#0891b2"/><text x="850" y="437" text-anchor="middle" fill="white" font-weight="700">3</text>
    <text x="884" y="424"><tspan x="884">Hasło pojawia się dopiero</tspan><tspan x="884" dy="27">w świadomie wybranym widoku.</tspan></text>
    <circle cx="850" cy="540" r="18" fill="#0891b2"/><text x="850" y="547" text-anchor="middle" fill="white" font-weight="700">4</text>
    <text x="884" y="534"><tspan x="884">W każdej chwili można</tspan><tspan x="884" dy="27">ponownie zablokować sejf.</tspan></text>
  </g>
  <text x="846" y="638" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="15">Wszystkie prezentowane dane są fikcyjne.</text>
</svg>
